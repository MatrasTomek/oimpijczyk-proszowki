<p-toast />

<div class="admin-section-header">
  <h1 class="admin-page-title">Aktualności</h1>
  <button pButton label="Dodaj aktualność" icon="pi pi-plus" class="p-button" (click)="openNew()"></button>
</div>

<p-table [value]="items()" styleClass="admin-table" [tableStyle]="{'min-width':'600px'}">
  <ng-template pTemplate="header">
    <tr>
      <th>Tytuł</th>
      <th>Kategoria</th>
      <th>Data</th>
      <th style="width:120px">Akcje</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-item>
    <tr>
      <td>{{ item.title }}</td>
      <td>{{ item.category }}</td>
      <td>{{ item.published_at | date:'d MMM yyyy':'':'pl' }}</td>
      <td>
        <div class="action-btns">
          <button pButton icon="pi pi-pencil" class="p-button-sm p-button-outlined" (click)="openEdit(item)"></button>
          <button pButton icon="pi pi-trash" class="p-button-sm p-button-outlined p-button-danger" (click)="delete(item.id)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr><td colspan="4" style="text-align:center;color:#aaa;padding:2rem">Brak aktualności</td></tr>
  </ng-template>
</p-table>

<p-dialog [(visible)]="dialogVisible" [header]="isNew ? 'Nowa aktualność' : 'Edytuj aktualność'" [modal]="true" [style]="{width:'560px'}">
  <div class="dialog-form">
    <div class="field">
      <label>Tytuł</label>
      <input pInputText [(ngModel)]="editItem.title" class="w-full" />
    </div>
    <div class="field">
      <label>Kategoria</label>
      <input pInputText [(ngModel)]="editItem.category" class="w-full" />
    </div>
    <div class="field">
      <label>Skrót (excerpt)</label>
      <textarea pTextarea [(ngModel)]="editItem.excerpt" rows="2" class="w-full"></textarea>
    </div>
    <div class="field">
      <label>Treść</label>
      <textarea pTextarea [(ngModel)]="editItem.content" rows="6" class="w-full"></textarea>
    </div>
    <div class="field">
      <label>Data publikacji</label>
      <input pInputText type="date" [(ngModel)]="editItem.published_at" class="w-full" />
    </div>

    <div class="field">
      <label>Zdjęcie <span class="optional">(opcjonalne)</span></label>
      @if (imagePreview) {
        <div class="image-preview">
          <img [src]="imagePreview" alt="Podgląd zdjęcia" />
          <button pButton icon="pi pi-times" class="p-button-sm p-button-outlined p-button-danger remove-img-btn" title="Usuń zdjęcie" (click)="removeImage()"></button>
        </div>
      } @else {
        <label class="upload-area">
          <i class="pi pi-image"></i>
          <span>Kliknij, aby wybrać zdjęcie</span>
          <input type="file" accept="image/*" (change)="onFileSelect($event)" style="display:none" />
        </label>
      }
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button pButton label="Anuluj" class="p-button-outlined" (click)="dialogVisible = false"></button>
    <button pButton [label]="isUploading ? 'Przesyłanie...' : 'Zapisz'" class="p-button" [disabled]="isUploading" (click)="save()"></button>
  </ng-template>
</p-dialog>
