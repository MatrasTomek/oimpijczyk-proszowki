<header class="site-header" [class.scrolled]="scrolled()">
  <div class="container header-inner">

    <!-- Logo -->
    <a routerLink="/" class="logo-link">
      <img src="assets/logo.jpg" alt="Olimpijczyk Proszówki" class="logo-img" />
    </a>

    <!-- Desktop nav -->
    <nav class="desktop-nav" aria-label="Nawigacja główna">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        class="nav-link"
      >{{ item.label }}</a>
    </nav>

    <!-- Hamburger -->
    <button class="hamburger" (click)="menuOpen.set(true)" aria-label="Otwórz menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- Mobile Drawer Overlay -->
<div class="mobile-overlay" [class.open]="menuOpen()" (click)="closeMenu()"></div>
<aside class="mobile-drawer" [class.open]="menuOpen()" aria-label="Menu mobilne">
  <div class="drawer-header">
    <img src="assets/logo.jpg" alt="Logo" class="drawer-logo" />
    <button class="drawer-close" (click)="closeMenu()" aria-label="Zamknij menu">&#x2715;</button>
  </div>
  <nav class="mobile-nav">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.path === '/' }"
      class="mobile-nav-link"
      (click)="closeMenu()"
    >{{ item.label }}</a>
  </nav>
</aside>
