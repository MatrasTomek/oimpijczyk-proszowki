<div class="page-hero">
  <div class="container">
    <h1 class="page-title">Galeria</h1>
    <p class="page-breadcrumb">Start / Galeria</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <h2 class="section-title">Zdjęcia</h2>
    <p class="section-subtitle">Wspomnienia z zawodów, treningów i obozów</p>

    <!-- Filtry kategorii -->
    <div class="category-filters">
      <button
        *ngFor="let cat of categories"
        class="filter-btn"
        [class.active]="selectedCategory === cat"
        (click)="selectedCategory = cat"
      >{{ cat }}</button>
    </div>

    <!-- Grid zdjęć -->
    <div class="gallery-grid">
      <div
        class="gallery-item"
        *ngFor="let item of filteredItems; let i = index"
        (click)="openLightbox(i)"
      >
        <img [src]="galleryService.imageUrl(item.filename)" [alt]="item.title ?? item.filename" loading="lazy" class="gallery-img" />
        <div class="gallery-overlay">
          <p class="gallery-title">{{ item.title ?? item.filename }}</p>
          <p-tag [value]="item.category" severity="warn" />
        </div>
      </div>
    </div>

    <p-galleria
      [(visible)]="lightboxVisible"
      [value]="lightboxImages"
      [(activeIndex)]="lightboxIndex"
      [fullScreen]="true"
      [showItemNavigators]="true"
      [showThumbnails]="false"
    >
      <ng-template pTemplate="item" let-img>
        <img [src]="img.itemImageSrc" [alt]="img.alt" style="max-height:90vh;max-width:100%;" />
      </ng-template>
    </p-galleria>

    <div class="empty-state" *ngIf="filteredItems.length === 0">
      <i class="pi pi-images"></i>
      <p>Brak zdjęć w tej kategorii</p>
    </div>
  </div>
</section>
