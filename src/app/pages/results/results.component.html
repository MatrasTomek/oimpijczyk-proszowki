<div class="page-hero">
  <div class="container">
    <h1 class="page-title">Wyniki zawodników</h1>
    <p class="page-breadcrumb">Start / Wyniki zawodników</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <h2 class="section-title">Ostatnie wyniki</h2>
    <p class="section-subtitle">Osiągnięcia naszych zawodników na zawodach</p>

    <p-table
      [value]="results"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      styleClass="results-table"
      [tableStyle]="{ 'min-width': '700px' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Zawodnik</th>
          <th>Zawody</th>
          <th>Dyscyplina</th>
          <th>Wynik</th>
          <th>Miejsce</th>
          <th>Data</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-r>
        <tr>
          <td class="athlete-name">{{ r.athlete }}</td>
          <td class="comp-name">{{ r.competition }}</td>
          <td>{{ r.discipline }}</td>
          <td class="result-time">{{ r.result }}</td>
          <td>
            <p-tag
              [value]="medalLabel(r.place)"
              [severity]="medalColor(r.place)"
            />
          </td>
          <td>{{ r.date | date: "d MMM yyyy" : "" : "pl" }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>
